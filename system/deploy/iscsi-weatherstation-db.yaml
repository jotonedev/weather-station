apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-iscsi
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-weatherstation-db-10g
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi
  iscsi:
    targetPortal: "192.168.0.20:3260"
    iqn: "iqn.2005-10.org.freenas.ctl:weather-station-k8s-iscsi"
    lun: 0
    fsType: ext4
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - rpi3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: weatherstation-db-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi
  resources:
    requests:
      storage: 10Gi
