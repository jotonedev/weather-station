# Minimal Docker Compose deployment for the weather-station microservices.

name: weather-station

services:
  database:
    image: ${REGISTRY:-registry.example.com}/database:latest
    environment:
      DUCKDB_PATH: "/data/weather.duckdb"
      DUCKDB_MAX_MEMORY: "128MB"
      DUCKDB_THREADS: "2"
    volumes:
      - db-data:/data
    expose:
      - "8090"

  data-ingest:
    image: ${REGISTRY:-registry.example.com}/data-ingest:latest
    environment:
      DATABASE_ADDRESS: "database:8090"
      HTTP_AUTH_USERNAME: "${HTTP_AUTH_USERNAME:-admin}"
      HTTP_AUTH_PASSWORD: "${HTTP_AUTH_PASSWORD:-changeme}"
    ports:
      - "8081:8080"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: ${REGISTRY:-registry.example.com}/frontend:latest
    environment:
      DATABASE_ADDRESS: "database:8090"
      HTTP_AUTH_USERNAME: "${HTTP_AUTH_USERNAME:-admin}"
      HTTP_AUTH_PASSWORD: "${HTTP_AUTH_PASSWORD:-changeme}"
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

  inference-server:
    image: ${REGISTRY:-registry.example.com}/inference-server:latest
    environment:
      INFERENCE_PORT: "50051"
      INFERENCE_HOST: "0.0.0.0"
      INFERENCE_MODEL_BACKEND: "timestral"
      INFERENCE_MODEL_NAME: "mistralai/Timestral-209M"
      INFERENCE_IDLE_TIMEOUT_SECONDS: "3600.0"
      INFERENCE_MAX_WORKERS: "4"
      INFERENCE_MAX_HORIZON_HOURS: "360"
    volumes:
      # Persist downloaded HuggingFace weights across restarts.
      - hf-cache:/home/appuser/.cache/huggingface
    expose:
      - "50051"

  # One-shot forecast job. Not started by plain "compose up" (profile).
  # Run it on demand, see the README for a host-cron example.
  inference-job:
    image: ${REGISTRY:-registry.example.com}/inference-job:latest
    profiles: ["job"]
    restart: "no"
    environment:
      DATABASE_ADDRESS: "database:8090"
      INFERENCE_SERVER_ADDRESS: "inference-server:50051"
    depends_on:
      database:
        condition: service_healthy
      inference-server:
        condition: service_healthy

volumes:
  db-data:
  hf-cache:
