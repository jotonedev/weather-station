apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "weather-station.fullname" . }}-db-seed
  labels:
    {{- include "weather-station.componentLabels" (dict "root" . "component" "database-seed") | nindent 4 }}
data:
  001_weather.sql: |
    CREATE TABLE IF NOT EXISTS weather (
        node_id        SYMBOL,
        ts             TIMESTAMP,
        wind_speed     FLOAT,
        wind_angle     FLOAT,
        raw_wind_speed FLOAT,
        raw_wind_angle FLOAT,
        temperature    FLOAT,
        humidity       FLOAT,
        pressure       FLOAT,
        rain_1h        FLOAT,
        rain_24h       FLOAT,
        rain_rate      FLOAT,
        pm1_0          INT,
        pm2_5          INT,
        pm10_0         INT,
        voc            INT,
        anemo_status          INT,
        anemo_agc             INT,
        anemo_agc_variance    INT,
        vane_status           INT,
        vane_agc              INT,
        vane_agc_variance     INT,
        rain_status           INT,
        rain_agc              INT,
        rain_agc_variance     INT
    ) TIMESTAMP(ts) PARTITION BY DAY;

  002_node_coordinates.sql: |
    CREATE TABLE IF NOT EXISTS node_coordinates (
        node_id       STRING,
        latitude      DOUBLE,
        longitude     DOUBLE,
        elevation_m   DOUBLE,
        location_name STRING
    );

  003_predictions.sql: |
    CREATE TABLE IF NOT EXISTS predictions (
        node_id           SYMBOL,
        ts                TIMESTAMP,
        horizon_hours     INT,
        rainfall_mm       FLOAT,
        temperature_c     FLOAT,
        humidity_pct      FLOAT,
        wind_direction_deg FLOAT,
        rainfall_confidence       FLOAT,
        temperature_confidence    FLOAT,
        humidity_confidence       FLOAT,
        wind_direction_confidence FLOAT
    ) TIMESTAMP(ts) PARTITION BY DAY;

  seed.sh: |
    #!/bin/sh
    set -e

    echo "Waiting for QuestDB at ${QUESTDB_URL} to become available..."
    until curl -s -f "${QUESTDB_URL}/exec?query=SELECT%201" > /dev/null 2>&1; do
      sleep 2
    done
    echo "QuestDB is reachable."

    echo "Applying schema migrations..."
    for sql_file in /seed/001_weather.sql /seed/002_node_coordinates.sql /seed/003_predictions.sql; do
      echo "Applying ${sql_file}..."
      QUERY=$(cat "${sql_file}")
      RESPONSE=$(curl -s -f -G --data-urlencode "query=${QUERY}" "${QUESTDB_URL}/exec")
      echo "Result: ${RESPONSE}"
    done

    echo "Checking initial seed data..."
    {{- range .Values.database.seed.nodes }}
    CHECK_RES=$(curl -s -G --data-urlencode "query=SELECT count() FROM node_coordinates WHERE node_id = '{{ .id }}'" "${QUESTDB_URL}/exec" || true)
    if echo "${CHECK_RES}" | grep -q '\[\[0\]\]'; then
      echo "Seeding node {{ .id }}..."
      INSERT_QUERY="INSERT INTO node_coordinates (node_id, latitude, longitude, elevation_m, location_name) VALUES ('{{ .id }}', {{ .lat }}, {{ .lon }}, {{ .elevation }}, '{{ .name }}')"
      curl -s -f -G --data-urlencode "query=${INSERT_QUERY}" "${QUESTDB_URL}/exec"
    else
      echo "Node {{ .id }} already exists or query skipped."
    fi
    {{- end }}

    echo "Database seeding completed successfully."
