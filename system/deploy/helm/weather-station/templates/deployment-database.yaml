{{- if .Values.database.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weather-station.fullname" . }}-database
  labels:
    {{- include "weather-station.componentLabels" (dict "root" . "component" "database") | nindent 4 }}
spec:
  replicas: {{ .Values.database.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "weather-station.componentSelectorLabels" (dict "root" . "component" "database") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "weather-station.componentSelectorLabels" (dict "root" . "component" "database") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.database.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.database.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.database.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: database
          image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.database.grpcPort }}
              protocol: TCP
          env:
            - name: DUCKDB_PATH
              value: "/data/weather.duckdb"
            - name: DUCKDB_MAX_MEMORY
              value: {{ .Values.database.duckdb.maxMemory | default "128MB" | quote }}
            - name: DUCKDB_THREADS
              value: {{ .Values.database.duckdb.threads | default 2 | quote }}
            - name: GRPC_ADDRESS
              value: "0.0.0.0:{{ .Values.database.grpcPort }}"
          livenessProbe:
            grpc:
              port: {{ .Values.database.grpcPort }}
              service: ""
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: {{ .Values.database.grpcPort }}
              service: "ready"
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.database.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-database-data" (include "weather-station.fullname" .)) .Values.database.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
