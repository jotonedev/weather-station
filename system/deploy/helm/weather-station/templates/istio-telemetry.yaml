{{- if and .Values.istio.enabled .Values.istio.telemetry.enabled }}
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: {{ include "weather-station.fullname" . }}-tracing
  labels:
    {{- include "weather-station.labels" . | nindent 4 }}
spec:
  tracing:
    - providers:
        - name: "jaeger"
      randomSamplingPercentage: 100.0
{{- end }}
