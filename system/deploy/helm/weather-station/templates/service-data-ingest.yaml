{{- if .Values.dataIngest.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "weather-station.fullname" . }}-data-ingest
  labels:
    {{- include "weather-station.componentLabels" (dict "root" . "component" "data-ingest") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.dataIngest.httpPort }}
      targetPort: http
      protocol: TCP
    - name: grpc
      port: {{ .Values.dataIngest.grpcPort }}
      targetPort: grpc
      protocol: TCP
  selector:
    {{- include "weather-station.componentSelectorLabels" (dict "root" . "component" "data-ingest") | nindent 4 }}
{{- end }}
