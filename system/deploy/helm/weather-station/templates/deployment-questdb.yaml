{{- if .Values.questdb.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weather-station.fullname" . }}-questdb
  labels:
    {{- include "weather-station.componentLabels" (dict "root" . "component" "questdb") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "weather-station.componentSelectorLabels" (dict "root" . "component" "questdb") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "weather-station.componentSelectorLabels" (dict "root" . "component" "questdb") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: questdb
          image: "{{ .Values.questdb.image.repository }}:{{ .Values.questdb.image.tag }}"
          imagePullPolicy: {{ .Values.questdb.image.pullPolicy }}
          ports:
            - name: pgwire
              containerPort: {{ .Values.questdb.service.pgwirePort }}
              protocol: TCP
            - name: http
              containerPort: {{ .Values.questdb.service.httpPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.questdb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/questdb
      volumes:
        - name: data
          {{- if .Values.questdb.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "weather-station.fullname" . }}-questdb
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
