{{- if .Values.tailscale.serviceHost.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "weather-station.fullname" . }}-tailscale-svc-host
  labels:
    {{- include "weather-station.labels" . | nindent 4 }}
data:
  # Entrypoint that overrides containerboot: brings up tailscaled (userspace)
  # and advertises the configured Tailscale Service via `tailscale serve
  # --service=...`, which both configures the endpoints and advertises them.
  entrypoint.sh: |
    #!/bin/sh
    set -eu
    : "${SERVICE_NAME:?SERVICE_NAME required}"
    : "${HOST_DEVICE_NAME:=weather-svc-host}"
    : "${DEVICE_TAG:=k3s-cluster}"
    : "${LOCAL_TARGET:=http://127.0.0.1:8080}"

    echo "[service-host] starting tailscaled (userspace)"
    /usr/local/bin/tailscaled --tun=userspace-networking \
      --state=/tmp/tailscaled.state &
    TS_PID=$!
    trap 'echo "[service-host] cleaning up"; /usr/local/bin/tailscale down >/dev/null 2>&1 || true; kill "$TS_PID" 2>/dev/null || true' TERM INT

    if [ -n "${TS_CLIENT_ID:-}" ] && [ -n "${TS_CLIENT_SECRET:-}" ]; then
      # OAuth client credentials (no expiry); containerboot-style combined key.
      AUTHKEY="${TS_CLIENT_ID}:${TS_CLIENT_SECRET}"
    elif [ -n "${TS_AUTHKEY:-}" ]; then
      # Pre-shared auth key (expires, requires rotation).
      AUTHKEY="${TS_AUTHKEY}"
    else
      echo "[service-host] ERROR: no auth configured" >&2
      exit 1
    fi

    echo "[service-host] authenticating (tag=$DEVICE_TAG, hostname=$HOST_DEVICE_NAME)"
    /usr/local/bin/tailscale up \
      --authkey="$AUTHKEY" \
      --hostname="$HOST_DEVICE_NAME" \
      --advertise-tags="$DEVICE_TAG" \
      --accept-dns=false \
      --accept-routes=false

    echo "[service-host] service advertise:"
{{- $svc := printf "svc:%s" .Values.tailscale.serviceHost.serviceName }}
{{ range $ep := .Values.tailscale.serviceHost.endpoints }}
    echo "  -- {{ $svc }} {{ $ep.protocol }}:{{ $ep.port }} -> ${LOCAL_TARGET}"
    if ! /usr/local/bin/tailscale serve --service="{{ $svc }}" --{{ $ep.protocol }}={{ $ep.port }} "${LOCAL_TARGET}"; then
      echo "[service-host] WARN: failed to advertise {{ $svc }} {{ $ep.protocol }}:{{ $ep.port }}"
    fi
{{ end }}

    echo "[service-host] ready; advertising {{ $svc }} on the tailnet"
    wait "$TS_PID"
{{- end }}
