{{- if .Values.dataIngest.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weather-station.fullname" . }}-data-ingest
  labels:
    {{- include "weather-station.componentLabels" (dict "root" . "component" "data-ingest") | nindent 4 }}
spec:
  replicas: {{ .Values.dataIngest.replicaCount }}
  selector:
    matchLabels:
      {{- include "weather-station.componentSelectorLabels" (dict "root" . "component" "data-ingest") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "weather-station.componentSelectorLabels" (dict "root" . "component" "data-ingest") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dataIngest.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dataIngest.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dataIngest.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: data-ingest
          image: "{{ .Values.dataIngest.image.repository }}:{{ .Values.dataIngest.image.tag }}"
          imagePullPolicy: {{ .Values.dataIngest.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.dataIngest.httpPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.dataIngest.grpcPort }}
              protocol: TCP
          env:
            - name: DATABASE_ADDRESS
              value: "{{ include "weather-station.fullname" . }}-database:{{ .Values.database.grpcPort }}"
            - name: HTTP_ADDRESS
              value: "0.0.0.0:{{ .Values.dataIngest.httpPort }}"
            - name: GRPC_ADDRESS
              value: "0.0.0.0:{{ .Values.dataIngest.grpcPort }}"
          livenessProbe:
            grpc:
              port: {{ .Values.dataIngest.grpcPort }}
              service: ""
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: {{ .Values.dataIngest.grpcPort }}
              service: "ready"
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.dataIngest.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
{{- end }}
