{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "weather-station.fullname" . }}-ingress
  labels:
    {{- include "weather-station.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /reading
            pathType: Prefix
            backend:
              service:
                name: {{ include "weather-station.fullname" . }}-data-ingest
                port:
                  number: {{ .Values.dataIngest.httpPort }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "weather-station.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.httpPort }}
{{- end }}
