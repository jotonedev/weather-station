{{- if .Values.testGenerator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weather-station.fullname" . }}-test-generator
  labels:
    {{- include "weather-station.componentLabels" (dict "root" . "component" "test-generator") | nindent 4 }}
  {{- $annotations := include "weather-station.componentAnnotations" (dict "root" . "component" .Values.testGenerator) | trim }}
  {{- if $annotations }}{{- $annotations | nindent 2 }}{{- end }}
spec:
  replicas: {{ .Values.testGenerator.replicaCount }}
  selector:
    matchLabels:
      {{- include "weather-station.componentSelectorLabels" (dict "root" . "component" "test-generator") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "weather-station.componentSelectorLabels" (dict "root" . "component" "test-generator") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $placement := include "weather-station.placement" (dict "component" .Values.testGenerator) | trim }}
      {{- if $placement }}{{- $placement | nindent 6 }}{{- end }}
      containers:
        - name: test-generator
          image: "{{ .Values.testGenerator.image.repository }}:{{ .Values.testGenerator.image.tag }}"
          imagePullPolicy: {{ .Values.testGenerator.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.testGenerator.grpcPort }}
              protocol: TCP
          env:
            - name: INGEST_URL
              value: "http://{{ include "weather-station.fullname" . }}-data-ingest:{{ .Values.dataIngest.httpPort }}/readings"
            - name: GRPC_ADDRESS
              value: "0.0.0.0:{{ .Values.testGenerator.grpcPort }}"
            - name: GENERATOR_INTERVAL
              value: {{ .Values.testGenerator.interval | quote }}
            - name: GENERATOR_NODE_IDS
              value: {{ .Values.testGenerator.nodeIds | quote }}
            {{- if .Values.testGenerator.auth }}
            - name: HTTP_AUTH_USERNAME
              value: {{ .Values.testGenerator.auth.username | quote }}
            - name: HTTP_AUTH_PASSWORD
              value: {{ .Values.testGenerator.auth.password | quote }}
            {{- end }}
          livenessProbe:
            grpc:
              port: {{ .Values.testGenerator.grpcPort }}
              service: ""
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: {{ .Values.testGenerator.grpcPort }}
              service: "ready"
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.testGenerator.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
{{- end }}
