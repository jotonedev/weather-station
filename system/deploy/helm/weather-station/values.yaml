# Default values for weather-station.

global:
  # Default StorageClass to use for PVCs (k3s default is local-path)
  storageClass: "local-path"
  imagePullSecrets:
    - name: gitea-registry-secret

# Keel automatic image update configuration (https://keel.sh)
keel:
  enabled: true
  policy: "force"
  trigger: "poll"
  pollSchedule: "@every 15m"

# Database microservice (gRPC with embedded DuckDB OLAP engine)
database:
  enabled: true
  replicaCount: 1
  annotations: {}
  image:
    repository: gitea.bream-puffin.ts.net/jotone/database
    tag: latest
    pullPolicy: Always
  grpcPort: 8090
  duckdb:
    maxMemory: "128MB"
    threads: 2
  persistence:
    enabled: true
    # truenas-iscsi StorageClass is bound to rpi3 node where iSCSI portal is reachable
    storageClass: "truenas-iscsi"
    accessMode: ReadWriteOnce
    size: 10Gi
    existingClaim: ""
  # Pin database pod to rpi3 node
  nodeSelector:
    kubernetes.io/hostname: "rpi3"
  tolerations:
    - key: "dedicated"
      operator: "Equal"
      value: "rpi3"
      effect: "PreferNoSchedule"
  affinity: {}
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Data Ingest microservice (HTTP for sensor ingestion, gRPC for health checks)
dataIngest:
  enabled: true
  replicaCount: 1
  annotations: {}
  image:
    repository: gitea.bream-puffin.ts.net/jotone/data-ingest
    tag: latest
    pullPolicy: Always
  httpPort: 8080
  grpcPort: 8090
  # Pin dataIngest to rpi3 node alongside database
  nodeSelector:
    kubernetes.io/hostname: "rpi3"
  tolerations:
    - key: "dedicated"
      operator: "Equal"
      value: "rpi3"
      effect: "PreferNoSchedule"
  affinity: {}
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Frontend microservice (HTTP for web UI, gRPC for health checks)
frontend:
  enabled: true
  replicaCount: 1
  annotations: {}
  image:
    repository: gitea.bream-puffin.ts.net/jotone/frontend
    tag: latest
    pullPolicy: Always
  httpPort: 8080
  grpcPort: 8090
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Inference Server (Python / PyTorch gRPC model serving)
inferenceServer:
  enabled: true
  replicaCount: 1
  annotations: {}
  image:
    repository: gitea.bream-puffin.ts.net/jotone/inference-server
    tag: latest
    pullPolicy: Always
  grpcPort: 50051
  # Forecast backend name (timestral or chronos-2). The image must bundle the
  # matching optional dependency (Dockerfile INFERENCE_BACKEND build arg).
  modelBackend: "timestral"
  modelName: "mistralai/Timestral-209M"
  idleTimeoutSeconds: 3600.0
  maxWorkers: 4
  maxHorizonHours: 360
  # Dedicated PVC cache for HuggingFace model weights
  modelCache:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    mountPath: /home/appuser/.cache/huggingface
  # Resources dedicated to ML inference
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi
  # Pin inferenceServer to nodes with label node-size=large (arm-01 and arm-02 with ~12GB RAM)
  nodeSelector:
    node-size: "large"
  tolerations: []
  affinity: {}
  securityContext:
    fsGroup: 10001
    runAsUser: 10001
    runAsGroup: 10001

# Inference CronJob
inferenceJob:
  enabled: true
  schedule: "0 * * * *" # Every hour
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  image:
    repository: gitea.bream-puffin.ts.net/jotone/inference-job
    tag: latest
    pullPolicy: Always
  grpcPort: 8090
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Traefik Ingress configuration
ingress:
  enabled: true
  className: "traefik"
  annotations: {}
  hosts:
    - "weather.rpi3.internal"
    - "weather.bream-puffin.ts.net"
  tls: []

# Zero-trust Kubernetes NetworkPolicies
networkPolicy:
  enabled: true
