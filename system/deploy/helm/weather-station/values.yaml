# Default values for weather-station.

global:
  # Default StorageClass to use for PVCs (k3s default is local-path)
  storageClass: "local-path"
  imagePullSecrets: []

# Database microservice (gRPC with embedded DuckDB OLAP engine)
database:
  enabled: true
  replicaCount: 1
  image:
    repository: weather-station/database
    tag: latest
    pullPolicy: IfNotPresent
  grpcPort: 8090
  duckdb:
    maxMemory: "128MB"
    threads: 2
  persistence:
    enabled: true
    # truenas-iscsi StorageClass is bound to rpi3 node where iSCSI portal is reachable
    storageClass: "truenas-iscsi"
    accessMode: ReadWriteOnce
    size: 10Gi
    existingClaim: ""
  # Pin database pod to rpi3 node
  nodeSelector:
    kubernetes.io/hostname: "rpi3"
  tolerations:
    - key: "dedicated"
      operator: "Equal"
      value: "rpi3"
      effect: "PreferNoSchedule"
  affinity: {}
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Data Ingest microservice (HTTP for sensor ingestion, gRPC for health checks)
dataIngest:
  enabled: true
  replicaCount: 1
  image:
    repository: weather-station/data-ingest
    tag: latest
    pullPolicy: IfNotPresent
  httpPort: 8080
  grpcPort: 8090
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Frontend microservice (HTTP for web UI, gRPC for health checks)
frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: weather-station/frontend
    tag: latest
    pullPolicy: IfNotPresent
  httpPort: 8080
  grpcPort: 8090
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Inference Server (Python / PyTorch gRPC model serving)
inferenceServer:
  enabled: true
  replicaCount: 1
  image:
    repository: weather-station/inference-server
    tag: latest
    pullPolicy: IfNotPresent
  grpcPort: 50051
  modelName: "amazon/chronos-2"
  idleTimeoutSeconds: 3600.0
  maxWorkers: 4
  maxHorizonHours: 360
  # Dedicated PVC cache for HuggingFace model weights
  modelCache:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    mountPath: /home/appuser/.cache/huggingface
  # Resources dedicated to ML inference
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi
  # Pin inferenceServer to nodes with label node-size=large (arm-01 and arm-02 with ~12GB RAM)
  nodeSelector:
    node-size: "large"
  tolerations: []
  affinity: {}
  securityContext:
    fsGroup: 10001
    runAsUser: 10001
    runAsGroup: 10001

# Inference CronJob
inferenceJob:
  enabled: true
  schedule: "0 * * * *" # Every hour
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  image:
    repository: weather-station/inference-job
    tag: latest
    pullPolicy: IfNotPresent
  grpcPort: 8090
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Traefik Ingress configuration
ingress:
  enabled: true
  className: "traefik"
  annotations: {}
  host: "weather.internal"
  tls: []

# Zero-trust Kubernetes NetworkPolicies
networkPolicy:
  enabled: true

# Istio Service Mesh & Tracing
istio:
  enabled: true
  mtlsMode: STRICT
  telemetry:
    enabled: true
    # Jaeger OpenTelemetry gRPC / OTLP endpoint
    jaegerAddress: "http://jaeger-collector.istio-system.svc.cluster.local:4317"
