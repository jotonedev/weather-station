[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-proto"
version = "0.1.0"
description = "Generated Protobuf and gRPC stubs for weather station"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "protobuf>=5.0.0",
    "grpcio>=1.60.0",
]
