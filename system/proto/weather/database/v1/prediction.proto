syntax = "proto3";

package weather.database.v1;

import "google/protobuf/timestamp.proto";

option go_package = "weather-station/gen/go/weather/database/v1;databasev1";

// HourlyPrediction is a forecast for an hourly horizon.
message HourlyPrediction {
  string node_id = 1;
  google.protobuf.Timestamp issue_time = 2;
  int32 horizon_hours = 3;
  optional float temperature_c = 4;
  optional float humidity_pct = 5;
  optional float rainfall_mm = 6;
  reserved 7;
  reserved "rainfall_confidence";
  optional float rain_probability = 8;
  optional float temperature_c_p10 = 9;
  optional float temperature_c_p90 = 10;
  optional float humidity_pct_p10 = 11;
  optional float humidity_pct_p90 = 12;
  optional float rainfall_mm_p90 = 13;
  optional float pressure_hpa = 14;
  optional float pressure_hpa_p10 = 15;
  optional float pressure_hpa_p90 = 16;
}

// DailyPrediction is a forecast for a daily horizon.
message DailyPrediction {
  string node_id = 1;
  google.protobuf.Timestamp issue_time = 2;
  int32 horizon_days = 3;
  optional float min_temperature_c = 4;
  optional float max_temperature_c = 5;
  optional float min_humidity_pct = 6;
  optional float max_humidity_pct = 7;
  optional float rainfall_mm = 8;
  reserved 9;
  reserved "rainfall_confidence";
  optional float rain_probability = 10;
  optional float min_temperature_c_p10 = 11;
  optional float max_temperature_c_p90 = 12;
  optional float rainfall_mm_p90 = 13;
  optional float pressure_hpa = 14;
  optional float pressure_hpa_p10 = 15;
  optional float pressure_hpa_p90 = 16;
}


