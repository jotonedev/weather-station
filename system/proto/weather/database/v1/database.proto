syntax = "proto3";

package weather.database.v1;

import "google/protobuf/timestamp.proto";
import "weather/database/v1/aggregate.proto";
import "weather/database/v1/node.proto";
import "weather/database/v1/prediction.proto";
import "weather/database/v1/reading.proto";

option go_package = "weather-station/gen/go/weather/database/v1;databasev1";

service ReadingDatabaseService {
  // Store a batch of raw readings.
  rpc StoreReadings(StoreReadingsRequest) returns (StoreReadingsResponse);
  // Stream raw readings for a node over a time range.
  rpc GetReadings(GetReadingsRequest) returns (stream GetReadingsResponse);
  // Return the most recent raw readings for a node.
  rpc GetLatestReadings(GetLatestReadingsRequest) returns (GetLatestReadingsResponse);
}


service PredictionDatabaseService {
  // Store a batch of forecast predictions.
  rpc StorePredictions(StorePredictionsRequest) returns (StorePredictionsResponse);
  // Return the latest forecast predictions for a node.
  rpc GetForecast(GetForecastRequest) returns (GetForecastResponse);
}

service ReadingAggregateService {
  // Return climate aggregates (temperature, humidity, pressure) per time bucket.
  rpc GetClimateAggregates(GetClimateAggregatesRequest) returns (GetClimateAggregatesResponse);
  // Return air quality aggregates (pm and voc) per time bucket.
  rpc GetAirQualityAggregates(GetAirQualityAggregatesRequest) returns (GetAirQualityAggregatesResponse);
}

service NodeDatabaseService {
  // Create a node with its static location metadata.
  rpc CreateNode(CreateNodeRequest) returns (CreateNodeResponse);
  // Update the location metadata of an existing node.
  rpc UpdateNode(UpdateNodeRequest) returns (UpdateNodeResponse);
  // Return the location metadata for a single node.
  rpc GetNodeCoordinates(GetNodeCoordinatesRequest) returns (GetNodeCoordinatesResponse);
  // Return the location metadata for all nodes.
  rpc ListNodeCoordinates(ListNodeCoordinatesRequest) returns (ListNodeCoordinatesResponse);
}


message StoreReadingsRequest {
  repeated Reading readings = 1;
}

message StoreReadingsResponse {
  uint64 stored = 1;
}

message StorePredictionsRequest {
  repeated Prediction predictions = 1;
}

message StorePredictionsResponse {
  uint64 stored = 1;
}

message CreateNodeRequest {
  NodeCoordinates node = 1;
}

message CreateNodeResponse {}

message UpdateNodeRequest {
  NodeCoordinates node = 1;
}

message UpdateNodeResponse {}

message GetReadingsRequest {
  string node_id = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
}

message GetReadingsResponse {
  Reading reading = 1;
}

message GetLatestReadingsRequest {
  string node_id = 1;
  uint32 limit = 2;
}

message GetLatestReadingsResponse {
  repeated Reading readings = 1;
}

message GetForecastRequest {
  string node_id = 1;
}

message GetForecastResponse {
  repeated Prediction predictions = 1;
}

message GetNodeCoordinatesRequest {
  string node_id = 1;
}

message GetNodeCoordinatesResponse {
  NodeCoordinates node = 1;
}

message ListNodeCoordinatesRequest {}

message ListNodeCoordinatesResponse {
  repeated NodeCoordinates nodes = 1;
}

message GetClimateAggregatesRequest {
  string node_id = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
  uint32 bucket_seconds = 4;
}

message GetClimateAggregatesResponse {
  repeated ClimateAggregate aggregates = 1;
}

message GetAirQualityAggregatesRequest {
  string node_id = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
  uint32 bucket_seconds = 4;
}

message GetAirQualityAggregatesResponse {
  repeated AirQualityAggregate aggregates = 1;
}
