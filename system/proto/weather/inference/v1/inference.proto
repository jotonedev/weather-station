syntax = "proto3";

package weather.inference.v1;

import "google/protobuf/timestamp.proto";
import "weather/database/v1/prediction.proto";

option go_package = "weather-station/gen/go/weather/inference/v1;inferencev1";

// InferenceService provides weather forecasts
service InferenceService {
  // PredictHourlyWeather executes hourly forecasting up to horizon_hours.
  rpc PredictHourlyWeather(PredictHourlyWeatherRequest) returns (PredictHourlyWeatherResponse);

  // PredictDailyWeather executes daily forecasting up to horizon_days.
  rpc PredictDailyWeather(PredictDailyWeatherRequest) returns (PredictDailyWeatherResponse);

  // GetModelInfo returns metadata and operational bounds for the active model.
  rpc GetModelInfo(GetModelInfoRequest) returns (GetModelInfoResponse);
}

// PredictHourlyWeatherRequest contains input data for hourly weather forecasting.
message PredictHourlyWeatherRequest {
  string node_id = 1;
  google.protobuf.Timestamp issue_time = 2;
  int32 horizon_hours = 3;
  repeated TimeSeriesObservation history = 4;
  optional double latitude = 5;
  optional bytes data_blob = 6;
  optional string data_blob_format = 7;
}

// PredictHourlyWeatherResponse contains hourly predictions.
message PredictHourlyWeatherResponse {
  repeated weather.database.v1.HourlyPrediction predictions = 1;
  google.protobuf.Timestamp computed_at = 2;
  optional bytes output_blob = 3;
}

// PredictDailyWeatherRequest contains input data for daily weather forecasting.
message PredictDailyWeatherRequest {
  string node_id = 1;
  google.protobuf.Timestamp issue_time = 2;
  int32 horizon_days = 3;
  repeated TimeSeriesObservation history = 4;
  optional double latitude = 5;
  optional bytes data_blob = 6;
  optional string data_blob_format = 7;
}

// PredictDailyWeatherResponse contains daily predictions.
message PredictDailyWeatherResponse {
  repeated weather.database.v1.DailyPrediction predictions = 1;
  google.protobuf.Timestamp computed_at = 2;
  optional bytes output_blob = 3;
}

// TimeSeriesObservation is an aggregated time bucket
message TimeSeriesObservation {
  // Start timestamp of the aggregated bucket.
  google.protobuf.Timestamp timestamp = 1;

  // Mean ambient temperature in Celsius.
  optional float temperature_c = 2;

  // Mean relative humidity percentage.
  optional float humidity_pct = 3;

  // Mean atmospheric pressure in hectopascals.
  optional float pressure_hpa = 4;

  // Mean wind speed in meters per second.
  optional float wind_speed_mps = 5;

  // Mean wind direction in degrees.
  optional float wind_direction_deg = 6;

  // Total accumulated rainfall in millimeters.
  optional float rainfall_mm = 7;

  // Minimum ambient temperature in Celsius.
  optional float min_temperature_c = 8;

  // Maximum ambient temperature in Celsius.
  optional float max_temperature_c = 9;

  // Minimum relative humidity percentage.
  optional float min_humidity_pct = 10;

  // Maximum relative humidity percentage.
  optional float max_humidity_pct = 11;

  // Minimum atmospheric pressure in hectopascals.
  optional float min_pressure_hpa = 12;

  // Maximum atmospheric pressure in hectopascals.
  optional float max_pressure_hpa = 13;
}

// GetModelInfoRequest requests metadata for the inference model.
message GetModelInfoRequest {}

// GetModelInfoResponse returns metadata for the inference model.
message GetModelInfoResponse {
  // Model name.
  string model_name = 1;

  // Maximum forecast horizon supported in hours.
  int32 max_horizon_hours = 3;
}
