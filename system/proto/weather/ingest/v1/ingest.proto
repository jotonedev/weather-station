syntax = "proto3";

package weather.ingest.v1;

import "weather/common/v1/common.proto";

option go_package = "weather-station/gen/go/weather/ingest/v1;ingestv1";

// WeatherIngest receives raw readings pushed by weather stations.
service WeatherIngest {
  // Push a batch of raw readings from a station.
  rpc Push(PushRequest) returns (PushResponse);
}

message PushRequest {
  string station_id = 1;
  repeated weather.common.v1.RawReading readings = 2;
}

message PushResponse {
  uint64 accepted = 1;
}
