version: v2
inputs:
  - directory: .
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-prost
    out: gen/rust
    opt:
      - file_descriptor_set=false
      - compile_well_known_types=false
  - local: protoc-gen-tonic
    out: gen/rust

