name: Build and Push Docker Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
    paths:
      - 'system/**'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'system/**'
      - '.github/workflows/docker.yml'

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ${{ vars.DOCKER_REGISTRY || 'ghcr.io' }}
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-go:
    name: Build Go Service (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - data-ingest
          - database
          - frontend
          - inference-job
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            # sha- prefix keeps Keel from parsing short SHAs as semver candidates
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - name: Setup cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.service }}-${{ hashFiles('system/go/Dockerfile', 'system/go.work', 'system/go.work.sum', format('system/go/{0}/**', matrix.service)) }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.service }}-

      - name: Build and push Go microservice
        uses: docker/build-push-action@v7
        with:
          context: system
          file: system/go/Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache-new ${{ runner.temp }}/.buildx-cache

  build-inference-server:
    name: Build Python Inference Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/inference-server
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            # sha- prefix keeps Keel from parsing short SHAs as semver candidates
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - name: Setup cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: ${{ runner.os }}-buildx-inference-server-${{ hashFiles('system/python/inference-server/Dockerfile', 'system/python/inference-server/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-buildx-inference-server-

      - name: Build and push inference-server
        uses: docker/build-push-action@v7
        with:
          context: system
          file: system/python/inference-server/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache-new ${{ runner.temp }}/.buildx-cache

  verify-latest:
    name: Verify latest tag integrity
    runs-on: ubuntu-latest
    needs:
      - build-go
      - build-inference-server
    # Only meaningful when latest was actually pushed (not on PRs)
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    strategy:
      fail-fast: false
      matrix:
        service:
          - data-ingest
          - database
          - frontend
          - inference-job
          - inference-server
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Keel tracks the digest of the mutable latest tag, so a partial
      # multi-arch push (e.g. aborted buildx run) would leave the cluster
      # rolling onto a broken image index. Fail the run if latest is
      # missing or does not contain every declared platform.
      - name: Verify multi-arch index for latest
        run: |
          image="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}:latest"
          output=$(docker buildx imagetools inspect "$image" 2>&1) || {
            echo "::error::$image is missing from the registry"; echo "$output"; exit 1; }
          echo "$output"
          missing=""
          for platform in $PLATFORMS; do
            echo "$output" | grep -q "Platform:.*$platform" || missing="$missing $platform"
          done
          if [ -n "$missing" ]; then
            echo "::error::$image is incomplete, missing platforms:$missing - do not deploy this digest"
            exit 1
          fi
          echo "$image contains all platforms ($PLATFORMS)"