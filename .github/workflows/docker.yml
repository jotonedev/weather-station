name: Build and Push Docker Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
    paths:
      - 'system/**'
      - '.github/workflows/docker.yml'

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ${{ vars.DOCKER_REGISTRY || 'ghcr.io' }}
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-healthprobe:
    name: Build Health Probe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/healthprobe
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Setup cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: ${{ runner.os }}-buildx-healthprobe-${{ hashFiles('system/go/common/cmd/healthprobe/Dockerfile', 'system/go/common/**') }}
          restore-keys: |
            ${{ runner.os }}-buildx-healthprobe-

      - name: Build and push healthprobe
        uses: docker/build-push-action@v7
        with:
          context: system
          file: system/go/common/cmd/healthprobe/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=local,src=${{ runner.temp }}/.buildx-cache
            type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/healthprobe:latest
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache-new ${{ runner.temp }}/.buildx-cache

  build-go:
    name: Build Go Service (${{ matrix.service }})
    needs: build-healthprobe
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - data-ingest
          - database
          - frontend
          - inference-job
          - test-generator
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}

      - name: Setup cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.service }}-${{ hashFiles(format('system/go/{0}/**', matrix.service), 'system/go/common/**', 'system/proto/gen/go/**') }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.service }}-

      - name: Build and push Go microservice
        uses: docker/build-push-action@v7
        with:
          context: system
          file: system/go/${{ matrix.service }}/Dockerfile
          build-contexts: |
            healthprobe=docker-image://${{ env.REGISTRY }}/${{ github.repository_owner }}/healthprobe:latest
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=local,src=${{ runner.temp }}/.buildx-cache
            type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}:latest
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache-new ${{ runner.temp }}/.buildx-cache

  build-inference-server:
    name: Build Python Inference Server
    needs: build-healthprobe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/inference-server
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}

      - name: Setup cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: ${{ runner.os }}-buildx-inference-server-${{ hashFiles('system/python/inference-server/Dockerfile', 'system/python/inference-server/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-buildx-inference-server-

      - name: Build and push inference-server
        uses: docker/build-push-action@v7
        with:
          context: system
          file: system/python/inference-server/Dockerfile
          build-contexts: |
            healthprobe=docker-image://${{ env.REGISTRY }}/${{ github.repository_owner }}/healthprobe:latest
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=local,src=${{ runner.temp }}/.buildx-cache
            type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/inference-server:lates
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache-new ${{ runner.temp }}/.buildx-cache
