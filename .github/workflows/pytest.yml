name: Python Tests

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pytest.yml'
      - 'system/python/inference-server/**'
      - 'system/proto/gen/python/**'
  pull_request:
    paths:
      - '.github/workflows/pytest.yml'
      - 'system/python/inference-server/**'
      - 'system/proto/gen/python/**'

permissions:
  contents: read

jobs:
  pytest:
    name: Run pytest
    runs-on: ubuntu-latest

    env:
      UV_VERSION: "0.13.3"
      PYTHON_VERSION: "3.15"
    defaults:
      run:
        working-directory: system/python/inference-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run Ruff lint checks
        run: uv run ruff check .

      - name: Check code formatting
        run: uv run ruff format --check .

      - name: Run type checks
        run: uv run ty check

      - name: Run pytest
        run: uv run pytest --cov=inference
