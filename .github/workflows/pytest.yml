name: Python Tests

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pytest.yml'
      - 'system/python/inference-server/**'
      - 'system/proto/gen/python/**'
  pull_request:
    paths:
      - '.github/workflows/pytest.yml'
      - 'system/python/inference-server/**'
      - 'system/proto/gen/python/**'

permissions:
  contents: read

jobs:
  pytest:
    name: Run pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: system/python/inference-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff lint checks
        run: uv run ruff check .

      - name: Check code formatting
        run: uv run ruff format --check .

      - name: Run type checks
        run: uv run ty check

      - name: Run pytest
        run: uv run pytest --cov=inference
