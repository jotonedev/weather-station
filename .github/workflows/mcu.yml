name: MCU Tests and Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mcu.yml'
      - 'mcu/**'
  pull_request:
    paths:
      - '.github/workflows/mcu.yml'
      - 'mcu/**'

permissions:
  contents: read

jobs:
  format:
    name: clang-format check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install clang-format
        run: sudo apt-get update -q && sudo apt-get install -y -q clang-format

      - name: Check formatting
        run: |
          CF=$(command -v clang-format)
          find src lib test -type f \( -name '*.cpp' -o -name '*.h' \) \
            ! -path 'lib/CC1101/*' ! -path 'lib/AS5600/src/AS5600.*' \
            ! -path 'lib/Aht20/src/Adafruit_AHTX0.*' ! -path 'lib/Bmp180/src/Adafruit_BMP085.*' \
            ! -path 'lib/Pms7003/src/PMS.*' \
            -exec "$CF" --dry-run --Werror {} +

      - name: Check RAII lock guards
        run: |
          if grep -rnE 'port(ENTER|EXIT)_CRITICAL|xSemaphore(Take|Give)' src lib \
            --exclude-dir=CC1101 --exclude='Sync.h'; then
            echo "Raw FreeRTOS lock calls found outside lib/Sync/src/Sync.h"
            exit 1
          fi

  unit-tests:
    name: Native tests and clang-tidy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install PlatformIO
        run: pip install -q platformio

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('mcu/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Run native unit tests
        run: pio test -e native

      - name: Install clang-tidy
        run: sudo apt-get update -q && sudo apt-get install -y -q clang-tidy

      - name: Run clang-tidy
        run: |
          set -o pipefail
          clang-tidy --config-file=.clang-tidy \
            lib/ARQ/src/ARQ.cpp lib/ARQ/src/TxLink.cpp lib/Weather/src/Weather.cpp \
            lib/Ingest/src/Ingest.cpp lib/Outbox/src/Outbox.cpp \
            lib/AS5600/src/MagnetDiagnostics.cpp lib/Anemometer/src/AnemometerState.cpp \
            lib/WindVane/src/WindVaneState.cpp lib/RainMeter/src/RainMeterLogic.cpp \
            lib/Pms7003/src/PmsDutyCycle.cpp \
            test/test_arq.cpp test/test_weather.cpp test/test_outbox.cpp test/test_ingest.cpp \
            test/test_as5600.cpp test/test_anemometer.cpp test/test_wind_vane.cpp \
            test/test_rain_meter.cpp test/test_aht20.cpp test/test_bmp180.cpp \
            test/test_pms7003.cpp test/main.cpp \
            -- -std=gnu++17 \
            -Ilib/ARQ/src -Ilib/Weather/src -Ilib/Ingest/src -Ilib/Outbox/src \
            -Ilib/AS5600/src -Ilib/Anemometer/src -Ilib/WindVane/src -Ilib/RainMeter/src \
            -Ilib/Aht20/src -Ilib/Bmp180/src -Ilib/Pms7003/src \
            -I.pio/libdeps/native/googletest/googletest/include \
            -I.pio/libdeps/native/googletest/googlemock/include \
            2>&1 | tee tidy.log
          if grep -qE "warning:|error:" tidy.log; then
            echo "clang-tidy findings detected"
            exit 1
          fi

  build:
    name: Build firmware
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install PlatformIO
        run: pip install -q platformio

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('mcu/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Build control node
        run: pio run -e control-node

      - name: Build control node (production mode)
        run: PLATFORMIO_BUILD_FLAGS='-DCALIBRATION_MODE=0' pio run -e control-node

      - name: Build base station
        run: pio run -e base-station

      - name: Build anemometer test
        run: pio run -e anemometer-test
