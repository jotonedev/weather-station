name: Generate protobuf code

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/proto-gen.yml'
      - 'system/proto/**'
  pull_request:
    paths:
      - '.github/workflows/proto-gen.yml'
      - 'system/proto/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      BUF_VERSION: v1.73.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint
        working-directory: system/proto
        run: buf lint

      - name: Generate
        working-directory: system/proto
        run: buf generate

      - name: Commit generated code
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain system/proto/gen)" ]; then
            git config user.name 'protobuf[bot]'
            git config user.email 'protobuf@example.com'
            git add system/proto/gen
            git commit -m "chore(proto): regenerate protobuf code"
            git push
          else
            echo "No generated code changes."
          fi
