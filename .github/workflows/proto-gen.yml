name: Generate protobuf code

on:
  push:
    paths:
      - 'system/proto/**'
    branches:
      - main
  pull_request:
    paths:
      - 'system/proto/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      BUF_VERSION: v1.73.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Rust protoc plugins
        working-directory: system/proto
        run: |
          cargo install protoc-gen-prost --locked
          cargo install protoc-gen-tonic --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Lint
        working-directory: system/proto
        run: buf lint

      - name: Generate
        working-directory: system/proto
        run: buf generate

      - name: Commit generated code
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain system/proto/gen)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add system/proto/gen
            git commit -m "chore(proto): regenerate protobuf code"
            git push
          else
            echo "No generated code changes."
          fi
