name: Helm Lint

on:
  workflow_dispatch:
  push:
    paths:
      - 'system/deploy/helm/**'
      - '.github/workflows/helm-lint.yml'
  pull_request:
    paths:
      - 'system/deploy/helm/**'
      - '.github/workflows/helm-lint.yml'

permissions:
  contents: read

jobs:
  lint:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint Helm Chart
        run: helm lint --strict system/deploy/helm/weather-station

      - name: Validate Template Rendering
        run: helm template test-release system/deploy/helm/weather-station
