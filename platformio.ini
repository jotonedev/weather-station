[platformio]
name = oasi
description = Weather station for external use with separate base station
default_envs = control-node

[common]

[env:control-node]
platform = espressif32
framework = espidf
monitor_speed = 115200
board = lolin_s3_mini
build_src_filter = +<control-node/> -<base-station/>

[env:base-station]
platform = espressif32
framework = espidf
monitor_speed = 115200
board = esp32dev
build_src_filter = +<base-station/> -<control-node/>
build_flags = 
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
