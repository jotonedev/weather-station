; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
name = oasi
description = Weather station for external use with separate base station
default_envs = control-node

[common]

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = 
	-O3
	-std=gnu++17

[env:control-node]
board = esp32dev
build_src_filter = +<control-node/> -<base-station/>
lib_deps = 
	fu-hsi/PMS Library@^1.1.0
	robtillaart/AS5600 @ ^0.6.7
	adafruit/Adafruit AHTX0@^2.0.6
	adafruit/Adafruit SGP30 Sensor@^2.0.3
	adafruit/Adafruit BMP085 Library@^1.2.4
	adafruit/Adafruit BMP280 Library@^3.0.0

[env:base-station]
board = lolin_s3_mini
build_src_filter = +<base-station/> -<control-node/>
build_flags = 
	${env.build_flags}
	-DBOARD_HAS_PSRAM
lib_deps = adafruit/Adafruit BMP280 Library@^3.0.0
monitor_dtr = 1
monitor_rts = 1
