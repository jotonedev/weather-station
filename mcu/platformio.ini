; PlatformIO Project Configuration File

[platformio]
name = oasi
description = Weather station for external use with separate base station
default_envs = control-node

[common]

[env]
platform = espressif32@~8.0.0
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = 
	-O3
	-std=gnu++23

[env:control-node]
board = esp32-s3-devkitc-1
build_src_filter = +<control-node/> -<base-station/>
lib_deps = 
	fu-hsi/PMS Library@^1.1.0
	robtillaart/AS5600 @ ^0.6.7
	adafruit/Adafruit AHTX0@^2.0.6
	adafruit/Adafruit SGP30 Sensor@^2.0.3
	adafruit/Adafruit BMP085 Library@^1.2.4
	stevemarple/SoftWire @ ^2.0.10
	stevemarple/AsyncDelay @ ^1.1.2

[env:base-station]
board = lolin_s3_mini
build_src_filter = +<base-station/> -<control-node/>
build_flags = 
	${env.build_flags}
	-DBOARD_HAS_PSRAM
lib_deps = adafruit/Adafruit BMP280 Library@^3.0.0
monitor_dtr = 1
monitor_rts = 1

; for unit tests
[env:native]
platform = native
framework =
build_flags = -std=gnu++23
build_src_filter = -<*>
lib_ignore = CC1101, RadioAdapter
test_framework = googletest
